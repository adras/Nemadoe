<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>NEMADEO - Neon Markdown editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --fade-time: 40s;
            --ink-base: #b7f7ff;
            --ui-base: #38f2ff;
            --bg-base: #050608;
            --borderW: 56px;
            --radius: 18px;
            --font: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            --mono: ui-monospace, Consolas, monospace;
            --ink-hue-span: 110deg;
            --ui-hue-span: 70deg;
            --rail-hue-span: 140deg;
            --neon-a: #00ffff;
            --neon-b: #7cff00;
            --neon-c: #ff4dff;
        }

        @property --hInk {
            syntax: "<angle>";
            inherits: true;
            initial-value: 0deg;
        }

        @property --hUI {
            syntax: "<angle>";
            inherits: true;
            initial-value: 0deg;
        }

        @property --hBg {
            syntax: "<angle>";
            inherits: true;
            initial-value: 0deg;
        }

        @keyframes bgDrift {
            0% {
                --hBg: 0deg;
            }

            50% {
                --hBg: 25deg;
            }

            100% {
                --hBg: 0deg;
            }
        }

        html, body {
            margin: 0;
            height: 100%;
            font-family: var(--font);
            background: var(--bg-base);
            overflow: hidden;
            animation: bgDrift calc(var(--fade-time) * 1.6) ease-in-out infinite;
        }

        .frame {
            height: 100%;
            display: grid;
            grid-template-columns: var(--borderW) 1fr var(--borderW);
        }

        .rail {
            background: #000;
        }

        .center {
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .topbar {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 14px;
            background: rgba(6,8,10,.85);
            color: #b8c7cf;
            box-shadow: inset 0 -1px 0 rgba(120,255,255,.25), 0 8px 24px rgba(0,0,0,.6);
        }

        .brand {
            font-weight: 700;
            letter-spacing: .6px;
            color: #d6e2e8;
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(160,180,190,.35);
            border-radius: 10px;
            padding: 6px 12px;
            cursor: pointer;
            color: #c9d6dd;
            text-shadow: none;
        }

            .btn:hover {
                border-color: rgba(120,255,255,.65);
                color: #e6faff;
            }

        select.btn option {
            background: var(--bg-base);
            color: #c9d6dd;
        }

        .separator {
            border-left: 1px solid rgba(160,180,190,.35);
            height: 20px;
            margin: 0 4px;
        }

        .wrap {
            flex: 1;
            overflow: auto;
            padding: 18px;
        }

        .paper {
            border-radius: var(--radius);
            background: rgba(0,0,0,.22);
            box-shadow: 0 0 34px rgba(56,242,255,.10), inset 0 0 26px rgba(0,0,0,.55);
        }

        .hint {
            padding: 10px 14px;
            font-size: 12px;
            opacity: .75;
            color: #9adfff;
        }

        @keyframes neonFlow {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 300% 50%;
            }
        }

        .editor {
            padding: 20px 22px 40px;
            outline: none;
            line-height: 1.6;
            font-size: 17px;
            contain: content;
            transform: translateZ(0);
            will-change: background-position;
            background: linear-gradient(90deg, var(--neon-a), var(--neon-b), var(--neon-c), var(--neon-a));
            background-size: 300% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: none;
            caret-color: #b7f7ff;
            text-shadow: 0 0 6px rgba(0,255,255,.55), 0 0 16px rgba(255,80,255,.45), 0 0 36px rgba(255,80,255,.35);
        }

            .editor h1, .editor h2, .editor h3,
            .editor h4, .editor h5, .editor h6,
            .editor h7, .editor h8, .editor h9, .editor h10 {
                line-height: 1.25;
                margin: .6em 0 .4em;
                text-shadow: 0 0 10px rgba(255,180,255,.65), 0 0 26px rgba(255,80,255,.55), 0 0 48px rgba(255,80,255,.45);
            }

            .editor h1 {
                font-size: 2em;
            }

            .editor h2 {
                font-size: 1.5em;
            }

            .editor h3 {
                font-size: 1.17em;
            }

            .editor h4 {
                font-size: 1em;
            }

            .editor h5 {
                font-size: 0.83em;
            }

            .editor h6 {
                font-size: 0.67em;
            }

            .editor h7 {
                font-size: 0.6em;
            }

            .editor h8 {
                font-size: 0.55em;
            }

            .editor h9 {
                font-size: 0.5em;
            }

            .editor h10 {
                font-size: 0.45em;
            }

            .editor pre {
                background: rgba(0,0,0,.4);
                padding: 12px;
                border-radius: 10px;
                text-shadow: none;
                -webkit-text-fill-color: var(--ink-base);
                color: var(--ink-base);
                -webkit-background-clip: border-box;
                background-clip: border-box;
            }

            .editor code {
                font-family: var(--mono);
            }

        .status {
            padding: 12px 16px;
            font-size: 11px;
            letter-spacing: .3px;
            color: rgba(180,190,195,.65);
            border-top: 1px solid rgba(120,255,255,.18);
        }

        .filename-input {
            width: 130px;
            padding: 6px 10px;
            font-size: 13px;
            font-family: var(--mono);
        }

            .filename-input::placeholder {
                color: rgba(160,180,190,.45);
            }

        .editor-raw {
            padding: 20px 22px 40px;
            outline: none;
            line-height: 1.6;
            font-size: 15px;
            font-family: var(--mono);
            background: transparent;
            color: #b7f7ff;
            caret-color: #b7f7ff;
            white-space: pre-wrap;
            word-break: break-word;
            width: 100%;
            box-sizing: border-box;
            border: none;
            resize: none;
            min-height: 300px;
        }

        ::selection {
            background: rgba(56,242,255,.35);
        }

        #fps-overlay {
            position: fixed;
            bottom: 12px;
            right: 16px;
            font-family: var(--mono);
            font-size: 12px;
            color: rgba(0,255,255,.75);
            background: rgba(0,0,0,.55);
            border: 1px solid rgba(0,255,255,.2);
            border-radius: 8px;
            padding: 4px 10px;
            pointer-events: none;
            z-index: 9999;
            letter-spacing: .5px;
        }
    </style>
</head>

<body>
    <div id="fps-overlay">⬡ <span id="fps-value">--</span> fps</div>
    <div class="frame">
        <div class="rail"></div>

        <div class="center">
            <div class="topbar">
                <b class="brand">NEMADEO v1.1</b>
                <button class="btn" onclick="cmd('bold')"><b>B</b></button>
                <button class="btn" onclick="cmd('italic')"><i>I</i></button>

                <span class="separator"></span>
                <button class="btn" onclick="setHeading('p')">Normal</button>
                <span class="separator"></span>

                <button class="btn" onclick="setHeading('h1')">H1</button>
                <button class="btn" onclick="setHeading('h2')">H2</button>
                <button class="btn" onclick="setHeading('h3')">H3</button>
                <button class="btn" onclick="setHeading('h4')">H4</button>
                <button class="btn" onclick="setHeading('h5')">H5</button>

                <select class="btn" onchange="if(this.value){ setHeading(this.value); this.value=''; }">
                    <option value="">Hx...</option>
                    <option value="h6">H6</option>
                    <option value="h7">H7</option>
                    <option value="h8">H8</option>
                    <option value="h9">H9</option>
                    <option value="h10">H10</option>
                </select>

                <button class="btn" onclick="cmd('insertUnorderedList')">&bull;</button>
                <button class="btn" onclick="cmd('insertOrderedList')">1.</button>
                <button class="btn" onclick="insertCodeBlock()">code</button>

                <input id="importInput" type="file" accept=".md,text/markdown,text/plain" style="display:none" onchange="importMD(this)" />
                <button class="btn" onclick="document.getElementById('importInput').click()">Import .md</button>
                <input id="filenameInput" class="btn filename-input" type="text" placeholder="filename" spellcheck="false" />
                <button id="toggleViewBtn" class="btn" onclick="toggleRawView()">Raw</button>
                <button class="btn" onclick="exportMD()">Export .md</button>

                <select class="btn" id="themeSelect" style="margin-left: auto;" onchange="changeTheme()">
                    <option value="-1">Auto Random</option>
                    <option value="0">Cyan / Lime / Magenta</option>
                    <option value="1">Aqua / Yellow / Pink</option>
                    <option value="2">Mint / Green / Violet</option>
                    <option value="3">Teal / Green / Rose</option>
                    <option value="4">Prismatic</option>
                </select>
                <button class="btn" id="fpsBtn" onclick="toggleFPS()" style="margin-left:8px;font-family:var(--mono);font-size:11px;">fps</button>
            </div>

            <div class="wrap">
                <div class="paper">
                    <div class="hint"></div>
                    <div id="editor" class="editor" contenteditable="true" spellcheck="false"></div>

                    <div class="status">
                        Words <b id="wc">0</b> | Characters <b id="cc">0</b>
                    </div>
                </div>
            </div>
        </div>

        <div class="rail"></div>
    </div>

    <script>
        const editor = document.getElementById("editor");
        const wcEl = document.getElementById("wc");
        const ccEl = document.getElementById("cc");

        const KEY = "neon_writer_md_v3";
        const FILENAME_KEY = "neon_writer_filename";

        // --- Filename input ---

        const filenameInput = document.getElementById("filenameInput");

        const savedFilename = localStorage.getItem(FILENAME_KEY);
        if (savedFilename) filenameInput.value = savedFilename;

        filenameInput.addEventListener("input", () => {
            localStorage.setItem(FILENAME_KEY, filenameInput.value);
        });

        // --- WYSIWYG commands ---

        function cmd(c, v = null) {
            editor.focus();
            document.execCommand(c, false, v);
        }

        function setHeading(tag) {
            editor.focus();
            const success = document.execCommand("formatBlock", false, tag);

            if (!success && tag.match(/^h\d+$/)) {
                const sel = window.getSelection();
                if (sel.rangeCount) {
                    const range = sel.getRangeAt(0);
                    const el = document.createElement(tag);
                    el.appendChild(range.extractContents());
                    range.insertNode(el);
                }
            }
        }

        function insertCodeBlock() {
            editor.focus();
            const sel = window.getSelection();
            if (!sel.rangeCount) return;

            const range = sel.getRangeAt(0);

            let node = sel.anchorNode;
            while (node && node !== editor) {
                if (node.nodeType === 1 && node.tagName === "PRE") {
                    const fragment = document.createDocumentFragment();
                    while (node.firstChild) fragment.appendChild(node.firstChild);
                    node.parentNode.replaceChild(fragment, node);
                    return;
                }
                node = node.parentNode;
            }

            const pre = document.createElement("pre");
            if (!range.collapsed) {
                pre.appendChild(range.cloneContents());
                range.deleteContents();
                range.insertNode(pre);
            } else {
                pre.appendChild(document.createElement("br"));
                range.insertNode(pre);
            }
            placeCursorInside(pre);
        }

        function placeCursorInside(el) {
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(el);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // --- Word / character count ---

        function updateCounts() {
            const t = editor.textContent || "";
            wcEl.textContent = t.trim() ? t.trim().split(/\s+/u).length : 0;
            ccEl.textContent = [...t].length;
        }

        // --- Autosave ---

        let saveTimer = null;

        editor.addEventListener("input", () => {
            updateCounts();
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => localStorage.setItem(KEY, editor.innerHTML), 300);
        });

        const saved = localStorage.getItem(KEY);
        if (saved) editor.innerHTML = saved;
        updateCounts();

        // --- HTML → Markdown ---

        function toMarkdown(node) {
            if (node.nodeType === 3) return node.textContent;
            if (node.nodeType !== 1) return "";

            const t = node.tagName.toLowerCase();
            const c = [...node.childNodes].map(toMarkdown).join("");

            if (t === "br") return "";
            if (t === "b" || t === "strong") return `**${c}**`;
            if (t === "i" || t === "em") return `*${c}*`;
            if (t === "code") return `\`${c}\``;
            if (t === "pre") return `\`\`\`\n${node.innerText.trim()}\n\`\`\``;
            if (t === "ul") return [...node.children].map(li => `- ${li.innerText.trim()}`).join("\n");
            if (t === "ol") return [...node.children].map((li, i) => `${i + 1}. ${li.innerText.trim()}`).join("\n");
            if (t.match(/^h\d+$/)) {
                const level = parseInt(t.substring(1), 10);
                const text = c.trim();
                return text ? `${"#".repeat(level)} ${text}` : "";
            }
            if (t === "div" || t === "p") return c.trim();

            return c;
        }

        // Collects top-level blocks, skips empty ones, joins with a single blank line
        function editorToMarkdown() {
            const blocks = [];
            for (const node of editor.childNodes) {
                const md = toMarkdown(node);
                if (md.trim()) blocks.push(md);
            }
            return blocks.join("\n\n") + "\n";
        }

        // --- Import ---

        function importMD(input) {
            const file = input.files[0];
            if (!file) return;

            const rawName = file.name.replace(/\.md$/i, "");
            filenameInput.value = rawName;
            localStorage.setItem(FILENAME_KEY, rawName);

            const reader = new FileReader();
            reader.onload = (e) => {
                const html = markdownToHTML(e.target.result);
                editor.innerHTML = html;
                localStorage.setItem(KEY, editor.innerHTML);
                updateCounts();
            };
            reader.readAsText(file);
            input.value = "";
        }

        function markdownToHTML(md) {
            const lines = md.replace(/\n{2,}/g, "\n\n").trim().split("\n");
            const output = [];
            let inCode = false;
            let codeBuf = [];
            let prevWasText = false;
            let prevWasBlank = false;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                if (line.startsWith("```")) {
                    if (!inCode) {
                        inCode = true;
                        codeBuf = [];
                    } else {
                        output.push(`<pre>${escapeHTML(codeBuf.join("\n"))}</pre>`);
                        inCode = false;
                        codeBuf = [];
                        prevWasText = false;
                        prevWasBlank = false;
                    }
                    continue;
                }

                if (inCode) { codeBuf.push(line); continue; }

                const hMatch = line.match(/^(#{1,10})\s*(.*)/);
                if (hMatch) {
                    const text = hMatch[2].trim();
                    if (text) {
                        const level = hMatch[1].length;
                        output.push(`<h${level}>${inlineMarkdown(text)}</h${level}>`);
                    }
                    prevWasText = false;
                    prevWasBlank = false;
                    continue;
                }

                if (line.startsWith("- ") || line.startsWith("* ")) {
                    const items = [];
                    let j = i;
                    while (j < lines.length && (lines[j].startsWith("- ") || lines[j].startsWith("* "))) {
                        items.push(`<li>${inlineMarkdown(lines[j].slice(2))}</li>`);
                        j++;
                    }
                    output.push(`<ul>${items.join("")}</ul>`);
                    i = j - 1;
                    prevWasText = false;
                    prevWasBlank = false;
                    continue;
                }

                if (line.match(/^\d+\.\s+(.*)/)) {
                    const items = [];
                    let j = i;
                    while (j < lines.length && lines[j].match(/^\d+\.\s+/)) {
                        items.push(`<li>${inlineMarkdown(lines[j].replace(/^\d+\.\s+/, ""))}</li>`);
                        j++;
                    }
                    output.push(`<ol>${items.join("")}</ol>`);
                    i = j - 1;
                    prevWasText = false;
                    prevWasBlank = false;
                    continue;
                }

                if (line.trim() === "") {
                    if (prevWasText && !prevWasBlank) {
                        output.push(`<div><br></div>`);
                        prevWasBlank = true;
                        prevWasText = false;
                    }
                } else {
                    output.push(`<div>${inlineMarkdown(line)}</div>`);
                    prevWasText = true;
                    prevWasBlank = false;
                }
            }

            return output.join("");
        }

        function inlineMarkdown(text) {
            return text
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
                .replace(/\*(.+?)\*/g, "<i>$1</i>")
                .replace(/`(.+?)`/g, "<code>$1</code>");
        }

        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // --- Raw / formatted toggle ---

        let isRawView = false;

        function toggleRawView() {
            const btn = document.getElementById("toggleViewBtn");
            if (!isRawView) {
                const md = editorToMarkdown();
                const textarea = document.createElement("textarea");
                textarea.id = "rawEditor";
                textarea.className = "editor-raw";
                textarea.value = md;
                textarea.style.height = editor.offsetHeight + "px";
                editor.style.display = "none";
                editor.parentNode.insertBefore(textarea, editor);
                btn.textContent = "Formatted";
                isRawView = true;
            } else {
                const textarea = document.getElementById("rawEditor");
                const md = textarea.value;
                textarea.remove();
                editor.style.display = "";
                editor.innerHTML = markdownToHTML(md);
                localStorage.setItem(KEY, editor.innerHTML);
                updateCounts();
                btn.textContent = "Raw";
                isRawView = false;
            }
        }

        // --- Export ---

        function exportMD() {
            const rawEl = document.getElementById("rawEditor");
            const md = rawEl ? rawEl.value : editorToMarkdown();
            const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
            const rawName = filenameInput.value.trim() || "neon";
            const filename = rawName.endsWith(".md") ? rawName : rawName + ".md";
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(a.href);
        }

        // --- Neon themes ---

        const NEON_PALETTES = [
            { name: "Cyan / Lime / Magenta", colors: ["#00ffff", "#7cff00", "#ff4dff"] },
            { name: "Aqua / Yellow / Pink", colors: ["#00e5ff", "#ffd000", "#ff5cff"] },
            { name: "Mint / Green / Violet", colors: ["#4dffff", "#4dff88", "#b84dff"] },
            { name: "Teal / Green / Rose", colors: ["#00ffd5", "#9dff00", "#ff6ad5"] },
            { name: "Prismatic", colors: ["#3cfffc", "#c6ff00", "#ff3cf5"] }
        ];

        let themeTimer = null;

        function applyPalette(idx) {
            const p = NEON_PALETTES[idx].colors;
            document.documentElement.style.setProperty("--neon-a", p[0]);
            document.documentElement.style.setProperty("--neon-b", p[1]);
            document.documentElement.style.setProperty("--neon-c", p[2]);
        }

        function shuffleNeonPalette() {
            const idx = Math.floor(Math.random() * NEON_PALETTES.length);
            applyPalette(idx);
            const sel = document.getElementById("themeSelect");
            if (sel && sel.value === "-1") {
                sel.options[0].text = "Auto Random (" + NEON_PALETTES[idx].name + ")";
            }
        }

        function startAutoTheme() {
            clearInterval(themeTimer);
            shuffleNeonPalette();
            themeTimer = setInterval(shuffleNeonPalette, 90000 + Math.random() * 60000);
        }

        function changeTheme() {
            const sel = document.getElementById("themeSelect");
            const val = parseInt(sel.value, 10);
            if (val === -1) {
                startAutoTheme();
            } else {
                clearInterval(themeTimer);
                sel.options[0].text = "Auto Random";
                applyPalette(val);
            }
        }

        startAutoTheme();

        // --- Keyboard shortcuts ---

        document.addEventListener("keydown", (e) => {
            if (e.ctrlKey && e.key === "s") {
                e.preventDefault();
                e.stopPropagation();
                exportMD();
            }
        }, true);

        editor.addEventListener("keydown", (e) => {
            if (e.key === "Tab") {
                e.preventDefault();
                e.stopPropagation();
                document.execCommand("insertHTML", false, "&#160;&#160;&#160;&#160;");
            }
        }, true);

        // --- FPS Counter + 60fps Limiter ---

        const TARGET_FPS = 20;
        const FRAME_INTERVAL = 1000 / TARGET_FPS;

        let fpsVisible = false;
        let lastFrameTime = 0;
        let frameCount = 0;
        let fpsAccum = 0;
        let lastFpsTick = performance.now();

        const fpsOverlay = document.getElementById("fps-overlay");
        const fpsValue = document.getElementById("fps-value");

        function toggleFPS() {
            fpsVisible = !fpsVisible;
            fpsOverlay.style.display = fpsVisible ? "block" : "none";
        }

        // JS-driven background-position animation (real 60fps cap)
        const ANIM_DURATION = parseFloat(getComputedStyle(document.documentElement)
            .getPropertyValue("--fade-time")) * 1000 * 1.2;

        let animStart = null;

        function fpsLoop(now) {
            requestAnimationFrame(fpsLoop);

            const elapsed = now - lastFrameTime;
            if (elapsed < FRAME_INTERVAL - 0.5) return; // skip frame — enforces 60fps cap

            lastFrameTime = now - (elapsed % FRAME_INTERVAL);

            // Drive background-position manually
            if (animStart === null) animStart = now;
            const progress = ((now - animStart) % ANIM_DURATION) / ANIM_DURATION;
            const pos = progress * 300; // 0% → 300%
            editor.style.backgroundPosition = pos + "% 50%";

            // FPS counter (rolling average over 30 frames)
            frameCount++;
            fpsAccum += elapsed;
            if (frameCount >= 30) {
                const avg = fpsAccum / frameCount;
                if (fpsVisible) fpsValue.textContent = Math.round(1000 / avg);
                frameCount = 0;
                fpsAccum = 0;
            }
        }

        requestAnimationFrame(fpsLoop);
    </script>
</body>
</html>
