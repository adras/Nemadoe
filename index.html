<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEMADEO 2 — Source-first Markdown + Math</title>
  <link rel="stylesheet" href="src/appearance.css">
  <script>window.MathJax={tex:{packages:{'[+]':['noerrors','noundefined']}},svg:{fontCache:'local'},startup:{typeset:false}};</script>
  <script defer src="vendor/mathjax-tex-svg.js"></script>
  <script defer src="src/model.js"></script>
  <script defer src="src/parser.js"></script>
  <script defer src="src/render.js"></script>
  <script defer src="src/app.js"></script>
  <script defer src="src/visuals.js"></script>
</head>
<body>
 <canvas id="plasma-cv"></canvas>
 <div class="frame"><div class="rail"></div><div class="center">
 <div class="topbar">
  <b class="brand">NEMADEO 2</b>
  <button class="btn" data-tool="bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button class="btn" data-tool="italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <button class="btn" data-tool="strike" title="Strikethrough">S̶</button>
  <span class="separator"></span>
  <button class="btn" data-tool="normal" title="Normal paragraph">Normal</button>
  <button class="btn" data-tool="h1" title="Heading 1">H1</button>
  <button class="btn" data-tool="h2" title="Heading 2">H2</button>
  <button class="btn" data-tool="h3" title="Heading 3">H3</button>
  <button class="btn" data-tool="h4" title="Heading 4">H4</button>
  <button class="btn" data-tool="h5" title="Heading 5">H5</button>
  <button class="btn" data-tool="bullet" title="Bulleted list">•</button>
  <button class="btn" data-tool="number" title="Numbered list">1.</button>
  <button class="btn" data-tool="code" title="Inline code">code</button>
  <button class="btn" data-tool="fence" title="Fenced code block">```</button>
  <span class="separator"></span>
  <button class="btn" data-tool="inlineMath" title="Inline math">ƒ(x)</button>
  <button class="btn" data-tool="blockMath" title="Display math">∑</button>
  <button class="btn" data-tool="fraction" title="Fraction">½</button>
  <button class="btn" data-tool="sqrt" title="Square root">√</button>
  <button class="btn" data-tool="power" title="Power">x²</button>
  <button class="btn" data-tool="subscript" title="Index">xᵢ</button>
  <button class="btn" data-tool="matrix" title="Matrix">▦</button>
  <span class="separator"></span>
  <input id="importInput" type="file" accept=".md,.markdown,text/plain" hidden>
  <button class="btn" id="importBtn" title="Import a Markdown file">Import .md</button>
  <input class="btn filename-input" id="filenameInput" title="Filename used when exporting Markdown" placeholder="filename" spellcheck="false">
  <button class="btn" id="toggleViewBtn" title="Switch between source and formatted editing">Raw</button>
  <button class="btn" id="exportBtn" title="Download the current Markdown source">Export .md</button>
  <select class="btn" id="themeSelect" title="Choose color theme" style="margin-left:auto" aria-label="Color theme">
   <option value="-1">Auto Random</option>
  <option value="0">Cyan / Lime / Magenta</option><option value="1">Aqua / Yellow / Pink</option><option value="2">Mint / Green / Violet</option><option value="3">Lava</option><option value="4">Prismatic</option><option value="5">Synthwave</option><option value="6">Deep Ocean</option><option value="7">Ember / Copper</option><option value="8">Emerald Night</option><option value="9">Amethyst</option><option value="10">Glacier</option><option value="11">Crimson Sunset</option>
  </select>
 </div>
 <div class="wrap"><div class="paper">
  <div class="hint">ONE SOURCE · REGIONAL EDITS · MARKDOWN + LATEX <span class="mode-label">Click a rendered formula to edit</span></div>
  <div id="editor" class="editor" contenteditable="true" spellcheck="false" aria-label="Formatted Markdown editor"></div>
  <textarea id="rawEditor" class="editor-raw" spellcheck="false" aria-label="Raw Markdown source" hidden></textarea>
  <div class="status">Words <b id="wc">0</b> | Characters <b id="cc">0</b> <span id="saveStatus" aria-live="polite"></span></div>
 </div></div>
 </div><div class="rail"></div></div>
 <div id="mathPanel" class="math-panel" hidden role="dialog" aria-label="Edit equation">
  <div class="math-bar" id="mathCommands">
   <strong style="margin-right:8px">Edit LaTeX</strong>
   <button class="btn" data-math-tool="fraction" title="Insert fraction (numerator / denominator)" aria-label="Insert fraction (numerator / denominator)">½</button><button class="btn" data-math-tool="sqrt" title="Insert square root" aria-label="Insert square root">√</button>
   <button class="btn" data-math-tool="power" title="Insert exponent" aria-label="Insert exponent">x²</button><button class="btn" data-math-tool="subscript" title="Insert subscript" aria-label="Insert subscript">xᵢ</button>
   <button class="btn" data-math-tool="sum" title="Insert summation" aria-label="Insert summation">∑</button><button class="btn" data-math-tool="matrix" title="Insert matrix" aria-label="Insert matrix">▦</button>
   <button class="btn" data-math-tool="blockMath" title="Insert boxed expression" aria-label="Insert boxed expression">□</button>
   <button class="btn btn-danger" id="mathDelete" title="Delete entire formula from Markdown (Ctrl+Z to undo)">Delete formula</button>
   <button class="btn" id="mathDone" title="Close formula editor (Esc or Ctrl+Enter)" style="margin-left:auto">Done ✓</button>
  </div>
  <textarea id="mathInput" title="Edit the LaTeX source of this formula" spellcheck="false" aria-label="LaTeX formula source"></textarea>
  <div id="mathPreview" class="math-preview"></div>
  <div id="mathError"></div>
  <div class="tiny-note">Every keystroke changes only this LaTeX region of the Markdown source. Esc to close.</div>
 </div>
</body></html>
